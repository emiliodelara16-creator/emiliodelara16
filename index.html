<!DOCTYPE html>
<html>
  <head>
    <title>RA Fantasma 3D</title>
    <!-- Librerías necesarias -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/2.2.1/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      
      <!-- 1. Precargar el modelo 3D (opcional pero recomendado) -->
      <a-assets>
        <a-asset-item id="modeloFantasma" src="Fantasma.obj"></a-asset-item>
      </a-assets>

      <!-- 2. Marcador Hiro -->
      <a-marker preset="hiro">
        <!-- 3. Cargar el modelo 3D en lugar del cubo -->
        <!-- Ajusta la escala y posición según cómo se vea tu modelo -->
        <a-entity 
          gltf-model="#modeloFantasma" 
          position="2 2 2" 
          scale="0.5 0.5 0.5"
          rotation="0 0 0">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
