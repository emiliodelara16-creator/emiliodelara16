<!DOCTYPE html>
<html>
  <head>
    <title>RA Fantasma 3D</title>
    <!-- Librerías necesarias -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      
      <!-- 1. Precargar el modelo 3D (opcional pero recomendado) -->
      <a-assets>
        <a-asset-item id="modeloFantasma" src="chandelure.glb"></a-asset-item>
      </a-assets>

      <!-- 2. Marcador Hiro -->
      <a-marker preset="hiro">
        <!-- 3. Cargar el modelo 3D en lugar del cubo -->
        <!-- Ajusta la escala y posición según cómo se vea tu modelo -->
        <!--<a-entity 
          gltf-model="#modeloFantasma" 
          position="0 0.5 0" 
          scale="2 2 2"
          rotation="0 0 0">
        </a-entity>
      </a-marker>-->
      <a-marker preset="hiro">
  <a-box position="0 0.5 0" material="color: red;"></a-box>
         <a-entity camera></a-entity>
</a-marker>
     
    </a-scene>
  </body>
</html>
